<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro-Nutrient Reverse Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Macro-Nutrient Reverse Calculator</h1>
        <p>Enter your daily targets to get meal suggestions</p>
    </header>

    <main>
        <!-- Macro Target Form -->
        <section id="macro-form-section">
            <h2>Set Your Targets</h2>
            <form id="macro-form">
                <div class="form-group">
                    <label for="calories">Calories (kcal)</label>
                    <input type="number" id="calories" name="calories" min="0">
                </div>

                <div class="form-group">
                    <label for="protein">Protein (g)</label>
                    <input type="number" id="protein" name="protein" min="0">
                </div>

                <div class="form-group">
                    <label for="carbs">Carbs (g)</label>
                    <input type="number" id="carbs" name="carbs" min="0">
                </div>

                <div class="form-group">
                    <label for="fat">Fat (g)</label>
                    <input type="number" id="fat" name="fat" min="0">
                </div>

                <div class="form-group">
                    <label>Dietary Preference</label>
                    <div class="radio-group">
                        <label><input type="radio" name="dietPreference" value="veg" checked> Vegetarian</label>
                        <label><input type="radio" name="dietPreference" value="non-veg"> Non-Vegetarian</label>
                        <!-- <label><input type="radio" name="dietPreference" value="both"> Both</label> -->
                    </div>
                </div>

                <button type="submit">Find Meals</button>
            </form>
            <p id="form-error" class="error-message"></p>
<div id="consistency-warning" class="warning-message" style="display: none;"></div>
        </section>

        <!-- Food List Section -->
        <section id="food-list-section">
            <h2>Food Database</h2>
            <input type="text" id="food-search" placeholder="Search foods by name...">
            <div id="food-list-container"></div>
        </section>

        <!-- Results Section (placeholder for now) -->
        <section id="results-section">
    <h2>Meal Suggestions</h2>
    <div id="results-container">
        <p id="results-placeholder">No results yet. Enter your targets above.</p>
    </div>
</section>
    </main>

    <script src="script.js"></script>
</body>

</html>
